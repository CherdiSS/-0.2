<!doctype html><html lang="ru"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Читатель PDF</title><style>
*{box-sizing:border-box}body{background:#14141a;color:#eee;font:17px -apple-system,Arial;margin:0;padding:20px 16px 40px}h1{font-size:24px}button,.file{background:#087efa;color:white;border:0;border-radius:12px;padding:15px;font:inherit;display:inline-block;margin:5px 0}button:disabled{opacity:.4}.bar{display:flex;gap:8px;flex-wrap:wrap}textarea{width:100%;height:170px;background:#23232c;color:white;border:1px solid #555;border-radius:12px;padding:12px;font:inherit}input[type=number]{width:75px;font:inherit}#reader{font-size:21px;line-height:2;white-space:pre-wrap;overflow-wrap:anywhere;max-height:52vh;overflow:auto;padding:12px;background:#202028;border-radius:12px}.active{background:#ffda32;color:#111;border-radius:4px}#status,small{color:#bcbccc}select{max-width:100%;font:inherit}label{display:inline-block;margin:8px 0}</style>
<h1>Читатель PDF</h1><label class="file">Открыть PDF<input id="pdfFile" type="file" accept="application/pdf,.pdf" hidden></label>
<p id="status" role="status">Выберите PDF или вставьте текст ниже.</p>
<div id="pages" hidden><div class="bar"><button id="prev">←</button><label>Страница <input id="pageNo" type="number" min="1" value="1"> / <span id="count"></span></label><button id="next">→</button><button id="go">Открыть</button></div><small>Чтение текущей страницы. Следующую откройте кнопкой →.</small></div>
<textarea id="src" placeholder="Текст текущей страницы или ваш текст"></textarea>
<div class="bar"><button id="play">▶ Читать</button><button id="pause">Пауза</button><button id="stop">Стоп</button></div>
<label>Скорость <input id="rate" type="range" min="0.5" max="1.5" step="0.05" value="0.95"></label><label>Размер <input id="size" type="range" min="16" max="32" value="21"></label>
<div id="reader"></div><p><small>PDF обрабатывается в браузере. Для загрузки библиотеки PDF.js нужен интернет. Сканы без текстового слоя не распознаются. После закрытия страницы PDF нужно выбрать заново.</small></p>
<script>
const $=id=>document.getElementById(id);let lib,doc,task,words=[],idx=0,state='idle',serial=0,utterance,current=1,request=0,loading=false;
function status(t){$('status').textContent=t}
function stop(){state='idle';serial++;if('speechSynthesis'in window)speechSynthesis.cancel();$('play').disabled=false;$('pause').textContent='Пауза';words.forEach(w=>w.classList.remove('active'))}
function render(){stop();idx=0;words=[];$('reader').replaceChildren();for(const t of $('src').value.split(/(\s+)/)){if(!t)continue;if(/^\s+$/.test(t)){$('reader').append(document.createTextNode(t));continue}let el=document.createElement('span');el.textContent=t;$('reader').append(el);words.push(el)}}
function speak(){if(state!=='playing')return;if(idx>=words.length){stop();return}const token=serial,el=words[idx];el.classList.add('active');const box=$('reader');box.scrollTop=Math.max(0,el.offsetTop-box.offsetTop-box.clientHeight/2);utterance=new SpeechSynthesisUtterance(el.textContent);utterance.lang='ru-RU';utterance.rate=+$('rate').value;utterance.onend=()=>{if(token!==serial||state!=='playing')return;el.classList.remove('active');idx++;speak()};utterance.onerror=e=>{if(token!==serial)return;stop();status('Чтение остановлено: '+e.error)};speechSynthesis.speak(utterance)}
$('play').onclick=()=>{if(!('speechSynthesis'in window)){status('Озвучка недоступна');return}if(state==='playing')return;if(state!=='paused')idx=0;state='playing';serial++;$('play').disabled=true;$('pause').textContent='Пауза';speak()};$('pause').onclick=()=>{if(state==='playing'){state='paused';serial++;speechSynthesis.cancel();words.forEach(w=>w.classList.remove('active'));$('play').disabled=false;$('pause').textContent='Продолжить'}else if(state==='paused')$('play').click()};$('stop').onclick=stop;$('src').oninput=render;$('size').oninput=()=>$('reader').style.fontSize=$('size').value+'px';
async function library(){if(lib)return lib;lib=await import('https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js').then(()=>window.pdfjsLib);if(!lib)throw Error('Не загрузилась библиотека PDF.js');lib.GlobalWorkerOptions.workerSrc='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';return lib}
async function show(n){if(!doc||loading)return;n=Math.max(1,Math.min(doc.numPages,Math.trunc(n)||1));const local=doc,id=++request;loading=true;stop();status('Извлекаю текст страницы '+n+'…');try{const page=await local.getPage(n);const data=await page.getTextContent();if(id!==request)return;let text=data.items.filter(x=>typeof x.str==='string').map(x=>x.str+(x.hasEOL?'\n':' ')).join('').replace(/(\p{L})[-\u00ad]\n(?=\p{L})/gu,'$1').trim();current=n;$('pageNo').value=n;$('src').value=text;render();status(text?'Страница '+n+' готова. Нажмите «Читать».':'На странице '+n+' нет извлекаемого текста. Возможно, это скан или пустая страница.');page.cleanup()}catch(e){status('Не удалось прочитать страницу: '+e.message)}finally{if(id===request)loading=false}}
$('pdfFile').onchange=async e=>{const file=e.target.files[0];if(!file)return;stop();request++;loading=false;$('pages').hidden=true;$('pdfFile').disabled=true;status('Открываю '+file.name+'…');try{if(task)await task.destroy();doc=null;const pdf=await library();task=pdf.getDocument({data:new Uint8Array(await file.arrayBuffer()),isEvalSupported:false});task.onPassword=(update,reason)=>{const p=prompt(reason===1?'Введите пароль PDF':'Неверный пароль. Попробуйте ещё раз');if(p===null){task.destroy();status('Открытие отменено')}else update(p)};doc=await task.promise;$('count').textContent=doc.numPages;$('pageNo').max=doc.numPages;$('pages').hidden=false;await show(1)}catch(e){status('Не удалось открыть PDF. Проверьте интернет и файл. '+(e.message||''))}finally{$('pdfFile').disabled=false;e.target.value=''}};
$('prev').onclick=()=>show(current-1);$('next').onclick=()=>show(current+1);$('go').onclick=()=>show(+$('pageNo').value);document.addEventListener('visibilitychange',()=>{if(document.hidden&&state==='playing')$('pause').click()});render();
</script></html>
